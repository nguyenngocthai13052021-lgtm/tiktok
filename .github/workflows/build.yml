name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev zlib1g-dev autoconf libtool pkg-config
          pip install buildozer cython
          buildozer -v android debug
      - uses: actions/upload-artifact@v3
        with:
          name: my-app
          path: bin/*.apk
          
